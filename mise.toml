[tools]
"github:Mic92/nixfmt-rs" = "latest"
gum = "latest"
#"nix:nil" = "latest"
#"nix:nixd" = "latest"
"pipx:mcp-nixos" = "latest"
prek = { version = "latest", postinstall = "prek install" }
taplo = "latest"
rumdl = "latest"
shfmt = "latest"
shellcheck = "latest"
betterleaks = "latest"
cocogitto = "latest"
"aqua:Mic92/nixfmt-rs" = "latest"
"github:agent-sh/agnix" = "latest"
lychee = "latest"

[shell_alias]
wf = "nix run .#write-flake"
flup = "nix flake update"
flin = "nix flake metadata"
fmt = "mise run format"
run-nix = 'run-nix() { local cli="${1}"; shift; [[ -z "${cli}" ]] && return 1;  if type -p "${cli}" >/dev/null 2>&1; then "${cli}" "${@}"; return $?; fi; nix develop {{config_root | quote}}# --quiet --command -- "${cli}" "${@}"; return $? }; run-nix'
statix = 'run-nix statix'
statix-check = 'run-nix statix check'
nixf-diagnose = 'run-nix nixf-diagnose'
nil = 'run-nix nil'
nil-diagnostics = 'run-nix nil diagnostics --deny-warnings'
nix-unit = 'run-nix nix-unit'

[tasks.lint]
description = "Lint nix, MarkDown, and TOML files"
run = [
  "taplo lint",
  "rumdl check",
  "nixf-diagnose **/*.nix",
  "statix check",
  "nil diagnostics --deny-warnings **/*.nix",
]

[tasks.format]
alias = "fmt"
description = "Format nix, MarkDown, and TOML files"
run = ["taplo fmt", "rumdl fmt", "nixfmt ."]

[tasks.checks]
alias = "check"
description = "Run flake checks with nix-eval-jobs to prevent OOM"
run = [
  "nix-eval-jobs --max-memory-size 3072 --gc-roots-dir /tmp/gcroot --force-recurse --flake .#checks",
]

[tasks.tests]
alias = "test"
description = "Run nix-unit tests"
run = [
  "nix develop {{config_root | quote}}# --quiet --command --  nix-unit --flake {{config_root | quote}}#tests",
]

