[tools]
"github:Mic92/nixfmt-rs" = "latest"
gum = "latest"
#"nix:nil" = "latest"
#"nix:nixd" = "latest"
"pipx:mcp-nixos" = "latest"
prek = { version = "latest", postinstall = "prek install" }
taplo = "latest"
rumdl = "latest"
shfmt = "latest"
shellcheck = "latest"
betterleaks = "latest"

[tasks.format]
alias = "fmt"
run = "nixfmt ."

[shell_alias]
wf = "nix run .#write-flake"
flup = "nix flake update"
flin = "nix flake metadata"
fmt = "mise run format"

# nix hash convert --hash-algo sha256 $(nix-prefetch-url https://raw.githubusercontent.com/rtk-ai/rtk/refs/tags/v1.1.0/hooks/opencode/rtk.ts)
# nix hash convert --hash-algo sha256 $(nix-prefetch-url --unpack https://raw.githubusercontent.com/rtk-ai/rtk/refs/tags/v1.1.0/hooks/opencode/rtk.ts)
# nix store prefetch-file --hash-type sha256 https://raw.githubusercontent.com/rtk-ai/rtk/refs/tags/v1.1.0/hooks/opencode/rtk.ts
